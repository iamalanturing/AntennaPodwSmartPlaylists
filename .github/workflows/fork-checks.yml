# Fork-only CI. DROP BEFORE ANY UPSTREAM PR.
# Mirror of upstream checks.yml. Differences: triggers, Gradle flags in ~/.gradle/gradle.properties,
# cache key, failure-only report steps, APK artifact name.
name: Fork Checks

on:
  push:
    branches: [ 'claude/**' ]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  wrapper-validation:
    name: "Gradle Wrapper Validation"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: gradle/actions/wrapper-validation@0723195856401067f7a2779048b490ace7a47d7c # v5

  static-analysis:
    name: "Static Code Analysis"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Cache Gradle
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*') }}-${{ github.sha }}
          restore-keys: |
            gradle-${{ hashFiles('**/*.gradle*') }}-
            gradle-
      - name: Configure parallel build
        run: |
          mkdir -p ~/.gradle
          {
            echo "org.gradle.parallel=true"
            echo "org.gradle.caching=true"
          } >> ~/.gradle/gradle.properties
      - name: XML code style
        run: |
          curl -s -L https://github.com/ByteHamster/android-xml-formatter/releases/download/1.1.0/android-xml-formatter.jar > android-xml-formatter.jar
          find . -wholename "*/res/layout/*.xml" | xargs java -jar android-xml-formatter.jar
          test $(git diff | wc -l) -eq 0 || (echo -e "\n\n===== Found XML code style violations! See output below how to fix them. =====\n\n" && git --no-pager diff --color=always && false)
      - name: Checkstyle, Lint, SpotBugs
        run: ./gradlew checkstyle lint
      - name: Print full lint report
        if: failure()
        run: |
          find . -name 'lint-results-*.txt' | while read -r f; do
            echo "===== $f ====="
            cat "$f"
          done
      - name: Print checkstyle report
        if: failure()
        run: |
          find . -path '*/build/reports/checkstyle/*.xml' | while read -r f; do
            echo "===== $f ====="
            grep -B1 "<error" "$f" || true
          done
      - name: Generate readable error messages for GitHub
        if: failure()
        run: |
          python .github/workflows/errorPrinter.py
          git diff --name-only | xargs -I '{}' echo "::error file={},line=1,endLine=1,title=XML Format::Run android-xml-formatter.jar on this file or view CI output to see how it should be formatted."
          false

  unit-test:
    name: "Unit Test: ${{ matrix.variant }}"
    needs: static-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        include:
          - variant: "PlayDebug"
            base-variant: "Debug"
            execute-tests: true
            upload-artifact: true
          - variant: "PlayRelease"
            base-variant: "Release"
            execute-tests: true
            upload-artifact: false
          - variant: "FreeRelease"
            base-variant: "Release"
            execute-tests: false
            upload-artifact: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Cache Gradle
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*') }}-${{ github.sha }}
          restore-keys: |
            gradle-${{ hashFiles('**/*.gradle*') }}-
            gradle-
      - name: Configure parallel build
        run: |
          mkdir -p ~/.gradle
          {
            echo "org.gradle.parallel=true"
            echo "org.gradle.caching=true"
          } >> ~/.gradle/gradle.properties
      - name: Create temporary release keystore
        run: |
          keytool -noprompt -genkey -v -keystore "app/keystore" -alias alias -storepass password -keypass password -keyalg RSA -validity 10 -dname "CN=antennapod.org, OU=dummy, O=dummy, L=dummy, S=dummy, C=US"
          cp app/keystore app-wearos/keystore
      - name: Build
        run: ./gradlew assemble${{ matrix.variant }}
      - name: Test
        if: matrix.execute-tests == true
        run: ./gradlew test${{ matrix.variant }}UnitTest test${{ matrix.base-variant }}UnitTest
      - name: Verify APK signer
        if: matrix.upload-artifact == true
        env:
          EXPECTED: 1a687fd9ba680cd77320f91d17ff039d69e9269763a7e46429e01fad96b16353
        run: |
          APK=app/build/outputs/apk/play/debug/app-play-debug.apk
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          ACTUAL=$("$SIGNER" verify --print-certs "$APK" \
            | grep -ioE "SHA-256 digest: [0-9a-f]+" | head -1 | awk '{print $NF}')
          echo "APK signer SHA-256: ${ACTUAL:-<none found>}"
          test "$ACTUAL" = "$EXPECTED" || (echo "::error::APK is not signed with the fork debug key." && false)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.upload-artifact == true
        with:
          name: AntennaPodMQ-debug
          path: app/build/outputs/apk/play/debug/app-play-debug.apk
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-reports-${{ matrix.variant }}
          path: '**/build/reports/tests/'

  emulator-test:
    name: "Emulator Test API ${{ matrix.version.api-level }} ${{ matrix.version.build-type }}"
    needs: static-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        version:
          - api-level: 23
            target: default
            build-type: debug
          - api-level: 30
            target: aosp_atd
            build-type: debug
          - api-level: 36
            target: aosp_atd
            build-type: debug
          - api-level: 23
            target: default
            build-type: release
          - api-level: 36
            target: aosp_atd
            build-type: release
    steps:
      - name: Remove unused packages to save space
        run: sudo apt-get remove firefox google-chrome-stable microsoft-edge-stable snapd powershell azure-cli llvm-16 llvm-17 llvm-18 llvm-16-dev llvm-17-dev llvm-18-dev
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Cache Gradle
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*') }}-${{ github.sha }}
          restore-keys: |
            gradle-${{ hashFiles('**/*.gradle*') }}-
            gradle-
      - name: Configure parallel build
        run: |
          mkdir -p ~/.gradle
          {
            echo "org.gradle.parallel=true"
            echo "org.gradle.caching=true"
          } >> ~/.gradle/gradle.properties
      - name: Create keystore for the release build
        if: matrix.version.build-type == 'release'
        run: keytool -genkeypair -dname "cn=AntennaPod CI, o=AntennaPod, c=DE" -alias alias -keystore app/keystore -storepass password -keypass password -keyalg RSA -keysize 2048 -validity 10000
      - name: Build with Gradle (debug)
        if: matrix.version.build-type == 'debug'
        run: ./gradlew assemblePlayDebugAndroidTest -PtestBuildType=debug
      - name: Build with Gradle (release)
        if: matrix.version.build-type == 'release'
        run: ./gradlew assemblePlayReleaseAndroidTest -PtestBuildType=release
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android Emulator test
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.version.api-level }}
          target: ${{ matrix.version.target }}
          arch: x86_64
          channel: canary
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/workflows/runEmulatorTests.sh ${{ matrix.version.build-type }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: test-report
          path: app/build/reports/androidTests/

  ci-summary:
    name: "CI Summary"
    needs:
      - wrapper-validation
      - emulator-test
      - unit-test
    runs-on: ubuntu-latest
    steps:
      - run: echo "All checks passed"
