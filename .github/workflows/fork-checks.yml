# Fork-only CI. NOT FOR UPSTREAM.
#
# THIS FILE MUST BE DROPPED BEFORE OPENING A PULL REQUEST AGAINST AntennaPod/AntennaPod.
# It exists only so this branch can be compiled at all: the development container cannot reach
# dl.google.com or maven.google.com through its proxy, so there is no local Gradle build and CI is
# the only compiler available. Upstream already has .github/workflows/checks.yml and does not want
# a second one. It is deliberately kept as a single isolated commit so `git rebase --onto` can
# remove it without touching any of the real work.
#
# This is a faithful mirror of upstream's checks.yml, job for job and step for step, so that a
# failure here is a failure upstream would also have seen. Upstream's own workflow only triggers on
# master/develop and on pull requests, so a fork branch never runs it.
#
# The only deliberate divergences, none of which change what gets caught:
#
#   1. Triggers. Upstream runs on pull_request and on push to master/develop. A fork branch matches
#      neither, so this runs on the fork's working branches instead. Doc-only pushes are skipped --
#      there are eight jobs here including three emulators, and compiling the app to discover that
#      Markdown still parses is expensive. A push touching code as well as docs still runs.
#   2. Gradle speed flags. Upstream writes org.gradle.parallel=true to local.properties, which
#      Gradle does not read org.gradle.* from -- it is an Android SDK file for sdk.dir -- so their
#      parallel flag has no effect. Here they go to ~/.gradle/gradle.properties, where they work
#      and where they stay out of the tracked tree that the XML code style step diffs. Affects
#      wall-clock time only, not pass or fail.
#   3. Cache key. Upstream's key is stable across commits and has no restore-keys, so once written
#      it is frozen and task outputs never accumulate. The commit is in the key here and
#      restore-keys falls back to the closest earlier cache.
#
# What is NOT here, deliberately: the fork debug signing key and the APK signer assertion that used
# to live in this file. Both were inert on this branch and could only ever fail. The signingConfig
# they depend on lives on the Smart Playlists branch; this branch is clean upstream develop, whose
# app/build.gradle has no forkDebug* config, so the properties were written and never read, the APK
# was signed with the runner's throwaway debug key, and the assertion compared it against a stale
# fingerprint and failed every run. Restore them only alongside the build.gradle change.
name: Fork Checks

on:
  push:
    branches: [ 'multiple-queues', 'multiple-queues/**', 'claude/**' ]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  wrapper-validation:
    name: "Gradle Wrapper Validation"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: gradle/actions/wrapper-validation@v5

  static-analysis:
    name: "Static Code Analysis"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*') }}-${{ github.sha }}
          restore-keys: |
            gradle-${{ hashFiles('**/*.gradle*') }}-
            gradle-
      - name: Configure parallel build
        # Written to GRADLE_USER_HOME, not to the project's gradle.properties. Gradle reads
        # org.gradle.* from ~/.gradle/gradle.properties at higher precedence than the project file,
        # so the flags take effect -- unlike upstream's local.properties, which Gradle never reads
        # org.gradle.* from at all. Writing them into the tracked project gradle.properties instead
        # would work for Gradle but breaks the XML code style step below, which asserts a clean
        # working tree with `git diff`: the two added lines are themselves a diff. That is why
        # upstream's otherwise-ineffective choice of local.properties never trips their own check.
        run: |
          mkdir -p ~/.gradle
          {
            echo "org.gradle.parallel=true"
            echo "org.gradle.caching=true"
          } >> ~/.gradle/gradle.properties
      - name: XML code style
        run: |
          curl -s -L https://github.com/ByteHamster/android-xml-formatter/releases/download/1.1.0/android-xml-formatter.jar > android-xml-formatter.jar
          find . -wholename "*/res/layout/*.xml" | xargs java -jar android-xml-formatter.jar
          test $(git diff | wc -l) -eq 0 || (echo -e "\n\n===== Found XML code style violations! See output below how to fix them. =====\n\n" && git --no-pager diff --color=always && false)
      - name: Checkstyle, Lint, SpotBugs
        run: ./gradlew checkstyle lint
      - name: Print full lint report
        # Lint prints only the first failure to the console ("Lint found N errors. First
        # failure:"), which turns fixing a batch into one CI round trip per error. Dump the
        # full text report instead. Fork-only debugging aid; does not affect pass or fail.
        if: failure()
        run: |
          find . -name 'lint-results-*.txt' -not -path '*/node_modules/*' | while read -r f; do
            echo "===== $f ====="
            cat "$f"
          done
      - name: Generate readable error messages for GitHub
        if: failure()
        run: |
          python .github/workflows/errorPrinter.py
          git diff --name-only | xargs -I '{}' echo "::error file={},line=1,endLine=1,title=XML Format::Run android-xml-formatter.jar on this file or view CI output to see how it should be formatted."
          false

  unit-test:
    name: "Unit Test: ${{ matrix.variant }}"
    needs: static-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        include:
          - variant: "PlayDebug"
            base-variant: "Debug"
            execute-tests: true
            upload-artifact: true
          - variant: "PlayRelease"
            base-variant: "Release"
            execute-tests: true
            upload-artifact: false
          - variant: "FreeRelease"
            base-variant: "Release"
            execute-tests: false
            upload-artifact: false
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*') }}-${{ github.sha }}
          restore-keys: |
            gradle-${{ hashFiles('**/*.gradle*') }}-
            gradle-
      - name: Configure parallel build
        # Written to GRADLE_USER_HOME, not to the project's gradle.properties. Gradle reads
        # org.gradle.* from ~/.gradle/gradle.properties at higher precedence than the project file,
        # so the flags take effect -- unlike upstream's local.properties, which Gradle never reads
        # org.gradle.* from at all. Writing them into the tracked project gradle.properties instead
        # would work for Gradle but breaks the XML code style step below, which asserts a clean
        # working tree with `git diff`: the two added lines are themselves a diff. That is why
        # upstream's otherwise-ineffective choice of local.properties never trips their own check.
        run: |
          mkdir -p ~/.gradle
          {
            echo "org.gradle.parallel=true"
            echo "org.gradle.caching=true"
          } >> ~/.gradle/gradle.properties
      - name: Create temporary release keystore
        run: |
          keytool -noprompt -genkey -v -keystore "app/keystore" -alias alias -storepass password -keypass password -keyalg RSA -validity 10 -dname "CN=antennapod.org, OU=dummy, O=dummy, L=dummy, S=dummy, C=US"
          cp app/keystore app-wearos/keystore
      - name: Build
        run: ./gradlew assemble${{ matrix.variant }}
      - name: Test
        if: matrix.execute-tests == true
        run: ./gradlew test${{ matrix.variant }}UnitTest test${{ matrix.base-variant }}UnitTest
      - uses: actions/upload-artifact@v4
        if: matrix.upload-artifact == true
        with:
          name: app-play-debug.apk
          path: app/build/outputs/apk/play/debug/app-play-debug.apk
      - name: Upload test reports
        # Fork-only debugging aid: upstream reads failures from the console, but a fork branch
        # that cannot build locally needs the HTML reports to diagnose a failing test.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.variant }}
          path: '**/build/reports/tests/'

  emulator-test:
    name: "Emulator Test API ${{ matrix.version.api-level }}"
    needs: static-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        version:
          - api-level: 23
            target: default
          - api-level: 30
            target: aosp_atd
          - api-level: 36
            target: aosp_atd
    steps:
      - name: Remove unused packages to save space
        run: sudo apt-get remove firefox google-chrome-stable microsoft-edge-stable snapd powershell azure-cli llvm-16 llvm-17 llvm-18 llvm-16-dev llvm-17-dev llvm-18-dev
      - uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*') }}-${{ github.sha }}
          restore-keys: |
            gradle-${{ hashFiles('**/*.gradle*') }}-
            gradle-
      - name: Configure parallel build
        # Written to GRADLE_USER_HOME, not to the project's gradle.properties. Gradle reads
        # org.gradle.* from ~/.gradle/gradle.properties at higher precedence than the project file,
        # so the flags take effect -- unlike upstream's local.properties, which Gradle never reads
        # org.gradle.* from at all. Writing them into the tracked project gradle.properties instead
        # would work for Gradle but breaks the XML code style step below, which asserts a clean
        # working tree with `git diff`: the two added lines are themselves a diff. That is why
        # upstream's otherwise-ineffective choice of local.properties never trips their own check.
        run: |
          mkdir -p ~/.gradle
          {
            echo "org.gradle.parallel=true"
            echo "org.gradle.caching=true"
          } >> ~/.gradle/gradle.properties
      - name: Build with Gradle
        run: ./gradlew assemblePlayDebugAndroidTest
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android Emulator test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.version.api-level }}
          target: ${{ matrix.version.target }}
          arch: x86_64
          channel: canary
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/workflows/runEmulatorTests.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-report-api-${{ matrix.version.api-level }}
          path: app/build/reports/androidTests/

  ci-summary:
    name: "CI Summary"
    needs:
      - wrapper-validation
      - emulator-test
      - unit-test
    runs-on: ubuntu-latest
    steps:
      - run: echo "All checks passed"
